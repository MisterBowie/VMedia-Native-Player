[package]
name = "native-player"
version = "0.1.1"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
